# コンテンツリポジトリの index 群 (article/<uuid>/info.json, article.json,
# slug-index.json, categories.json) は cf build が wrangler.config.ts の
# build.command (hagaki generate) で生成し、cf で deploy する。
# 生成物は git にコミットしない — Workers Assets にだけ載る。
#
# PR / main への push / 手動実行でビルドと dry-run を行い、main への push のときだけ本番に出す。
# 必要な secret: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
name: Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # 本番 deploy (main への push) は固定のグループで直列化する。
  # PR / 手動実行は dry-run までなので ref ごとに分け、本番の待ち行列を押し出さない。
  group: ${{ github.event_name == 'push' && 'deploy-production' || format('deploy-{0}', github.ref) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          # info.json の履歴マージ (git log) に全履歴が必要
          fetch-depth: 0

      # package.json の packageManager から pnpm の版を読む
      # pnpm 12 対応は v6.1.0 から (v6 タグは v6.0.10 のまま) なので SHA で固定する
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      # Wrangler bundler のビルドは --mode を明示しないとモードを記録しない
      - run: pnpm exec cf build --mode production

      - run: pnpm exec cf deploy --prebuilt --mode production --dry-run

      - if: github.event_name == 'push'
        run: pnpm exec cf deploy --prebuilt --mode production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
