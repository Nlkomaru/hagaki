name: Publish package

# GitHub Release を publish したときだけ @morinoparty/hagaki を GitHub Packages に公開する。
# version はリリースのタグ (v0.2.0) から決める。package.json の version は据え置き。
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm (package.json の packageManager) と Node (.node-version) をまとめて入れる。
      # pnpm/action-setup の self-installer (npm 経由) を使わないので速い
      - uses: pnpm/setup@v3
        with:
          cache: true # pnpm store を lockfile ごとにキャッシュ
          install: false # install は下で --frozen-lockfile 付きで明示的に行う

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run check:ci
      - run: pnpm run build

      - name: Set version from the release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::release tag is empty"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = process.argv[1];
            fs.writeFileSync("package.json", `${JSON.stringify(pkg, null, 4)}\n`);
          ' "$VERSION"
          echo "publishing @morinoparty/hagaki@$VERSION"

      # 公開先は package.json の publishConfig.registry (GitHub Packages)。
      # 以前は setup-node の registry-url が書いていた認証設定を ~/.npmrc に書く。
      # トークンそのものは書かず、pnpm が実行時に NODE_AUTH_TOKEN を展開する
      - name: Configure GitHub Packages auth
        run: |
          {
            echo "@morinoparty:registry=https://npm.pkg.github.com"
            echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}'
          } >> ~/.npmrc

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm publish --no-git-checks
