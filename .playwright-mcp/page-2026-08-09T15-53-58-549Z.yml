          - paragraph [ref=f4e72]: このページでは森パ内でのチャットの仕方について書いていきます！
          - heading "チャットとは？" [level=2] [ref=f4e73]
          - paragraph [ref=f4e74]:
            - text: 知らない方も少ないと思いますが一応説明しておきます ゲーム内で
            - strong [ref=f4e75]: T
            - text: を押すとチャット画面が開き↓のようにチャットする事ができます ここでサーバー内の方々と会話をする事ができます！
          - heading "日本語入力" [level=2] [ref=f4e76]
          - paragraph [ref=f4e77]:
            - text: これが初心者の方が一番困るところだと思います！ 他のゲームやマイクラで普通のワールドをマルチプレイする時などは普通にチャットに日本語を打つだけでできますが、
            - strong [ref=f4e78]: サーバーは普通に打つだけではできません!
            - strong [ref=f4e79]: このサーバーの日本語入力の仕方は日本語で文字を打った後に英語変換キーを押すことでできます
            - strong [ref=f4e80]: 日本語で文字を打っているときは文字が打たれてないように見えますが大丈夫です
            - text: 実際にやってみるとこんな感じ
          - img "書いているけど見えない！" [ref=f4e83]
          - img "でも変換キーを押すと出てくる！" [ref=f4e86]
          - paragraph [ref=f4e87]: こうすることで日本語入力ができます！
          - heading "その他の機能について！" [level=2] [ref=f4e88]
          - heading "Discordチャンネル" [level=3] [ref=f4e89]
          - paragraph [ref=f4e90]: マイクラのチャット内でDiscordで話している人と会話したりする時に使うのがDiscordチャンネルです Discordチャンネルに入るには**/ch d**と打つことでDiscordチャンネルに入ることができます
          - paragraph [ref=f4e91]: Discordにも聞き専チャンネルがありますがそれと同じ役割です Discordチャンネル意外のところにボイスチャットの返信などを書くと迷惑になる事があるのでDiscordチャンネルや聞き専に書きましょう！
